# Builds the web app and publishes it on GitHub Pages at https://<owner>.github.io/<repo>/.
# Needs Pages enabled with "GitHub Actions" as the source (Settings → Pages).
name: Deploy web app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push replaces a deployment still waiting
concurrency:
  group: pages
  cancel-in-progress: true

env:
  # The game server the published app plays on
  SERVER_URL: wss://ascensore-server.fly.dev/ws

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.9
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: >
          flutter build web --release
          --base-href /${{ github.event.repository.name }}/
          --dart-define=SERVER_URL=${{ env.SERVER_URL }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
