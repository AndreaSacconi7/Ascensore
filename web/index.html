<!DOCTYPE html>
<html lang="it">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Ascensore, il gioco di carte delle scommesse: online da 2 a 4 giocatori o contro il computer.">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0A0F26">

  <!-- Link previews -->
  <meta property="og:title" content="Ascensore">
  <meta property="og:description" content="Il gioco di carte delle scommesse: online da 2 a 4 giocatori o contro il computer.">
  <meta property="og:image" content="icons/Icon-512.png">
  <meta property="og:type" content="website">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Ascensore">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Ascensore</title>
  <link rel="manifest" href="manifest.json">
</head>
<body style="margin: 0; background: #0A0F26;">
  <!-- Drawn while the app downloads, like the app's own loading screen (lib/pages/loading_screen.dart):
       the same cards, logo and spinner in the same place, so nothing moves when the app takes over -->
  <style>
    #splash {
      position: fixed; inset: 0; overflow: hidden;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: linear-gradient(#1B2257, #0A0F26);
    }
    #splash .glow { position: absolute; border-radius: 50%; }
    #splash .fan { position: relative; width: 166px; height: 115px; }
    #splash .card {
      position: absolute; left: 50%; bottom: 0; width: 64px; height: 103px; box-sizing: border-box;
      padding: 2.5px; background: #fff; border: 1px solid rgba(0, 0, 0, .08); border-radius: 6.4px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, .35); transform-origin: 50% 100%;
    }
    #splash .card img { width: 100%; height: 100%; object-fit: contain; }
    #splash .logo { height: 42px; margin-top: 24px; filter: invert(1); }
    #splash .spinner {
      width: 28px; height: 28px; margin-top: 32px; border: 4px solid transparent; border-top-color: #F5C451;
      border-radius: 50%; animation: spin .9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
  <div id="splash">
    <div class="glow" style="top: -120px; left: -80px; width: 320px; height: 320px;
         background: radial-gradient(rgba(91, 108, 255, .28), rgba(91, 108, 255, 0) 70%);"></div>
    <div class="glow" style="bottom: -140px; right: -100px; width: 360px; height: 360px;
         background: radial-gradient(rgba(28, 156, 119, .28), rgba(28, 156, 119, 0) 70%);"></div>
    <div class="fan">
      <div class="card" style="transform: translateX(-50%) translateX(-39.7px) rotate(-12.6deg);">
        <img src="assets/assets/cards/CUPS_1.png" alt=""></div>
      <div class="card" style="transform: translateX(-50%) translateY(-6.2px);">
        <img src="assets/assets/cards/COINS_3.png" alt=""></div>
      <div class="card" style="transform: translateX(-50%) translateX(39.7px) rotate(12.6deg);">
        <img src="assets/assets/cards/SWORDS_10.png" alt=""></div>
    </div>
    <img class="logo" src="assets/assets/brand/logo.png" alt="Ascensore">
    <div class="spinner"></div>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', () => document.getElementById('splash')?.remove());
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
